<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071e2b">
  <meta name="description" content="青いベタと、水草と光。時刻とともに表情を変える、静かな水景。">
  <title>水縁 — SUIREN</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-contract" viewBox="0 0 24 24"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
  </defs></svg>
  <main class="aquarium" id="aquarium" aria-label="ベタが泳ぐ水槽">
    <canvas id="water" tabindex="0" aria-label="水槽。クリック、タップ、F キー、または Enter キーで餌をあげられます。Space キーで一時停止します。">Canvas に対応したブラウザでお楽しみください。</canvas>
    <div class="glass" aria-hidden="true"></div>
    <div class="tank-tools" id="tankTools" role="group" aria-label="水槽の操作">
      <button id="pauseButton" type="button" aria-label="動きを一時停止" aria-pressed="false" aria-keyshortcuts="Space"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
      <button id="fullscreenButton" type="button" aria-label="全画面で眺める" aria-pressed="false" aria-keyshortcuts="G"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
